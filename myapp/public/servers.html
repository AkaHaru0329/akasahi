<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Server Dashboard</title>
</head>
<body>

  <h1>Server Dashboard</h1>

  <h2>サーバー追加</h2>

  <input id="name" placeholder="Server Name">

  <select id="status">
    <option value="ONLINE">ONLINE</option>
    <option value="OFFLINE">OFFLINE</option>
  </select>

  <input id="cpu" type="number" placeholder="CPU">
  <input id="memory" type="number" placeholder="Memory">

  <button onclick="addServer()">追加</button>

  <hr>

  <h2>サーバー一覧</h2>

  <table border="1">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Status</th>
        <th>CPU</th>
        <th>Memory</th>
        <th>更新</th>
      </tr>
    </thead>

    <tbody id="serverList"></tbody>
  </table>

  <script>
    async function loadServers() {
      const response = await fetch("/api/servers");
      const servers = await response.json();

      const list = document.getElementById("serverList");
      list.innerHTML = "";

      servers.forEach((server) => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${server.id}</td>
          <td>${server.name}</td>

          <td>
            <select id="status-${server.id}">
              <option value="ONLINE"
                ${server.status === "ONLINE" ? "selected" : ""}>
                ONLINE
              </option>

              <option value="OFFLINE"
                ${server.status === "OFFLINE" ? "selected" : ""}>
                OFFLINE
              </option>
            </select>
          </td>

          <td>
            <input
              id="cpu-${server.id}"
              type="number"
              value="${server.cpu_usage}"
            >
          </td>

          <td>
            <input
              id="memory-${server.id}"
              type="number"
              value="${server.memory_usage}"
            >
          </td>

          <td>
            <button onclick="updateServer(${server.id})">
              更新
            </button>
          </td>
        `;

        list.appendChild(row);
      });
    }

    async function addServer() {
      const name = document.getElementById("name").value;
      const status = document.getElementById("status").value;
      const cpu = Number(document.getElementById("cpu").value);
      const memory = Number(document.getElementById("memory").value);

      await fetch("/api/servers", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: name,
          status: status,
          cpu_usage: cpu,
          memory_usage: memory
        })
      });

      loadServers();
    }

    async function updateServer(id) {
      const status =
        document.getElementById(`status-${id}`).value;

      const cpu =
        Number(document.getElementById(`cpu-${id}`).value);

      const memory =
        Number(document.getElementById(`memory-${id}`).value);

      await fetch(`/api/servers/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          status: status,
          cpu_usage: cpu,
          memory_usage: memory
        })
      });

      loadServers();
    }

    loadServers();
  </script>

</body>
</html>
